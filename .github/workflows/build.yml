# Builds RTL@3D OS's packages on arm64 and publishes the signed repository
# on GitHub Pages: https://inaim-finailabz.github.io/rtl3d-os/{edge,v26.06}
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # One repository per Nura base, each built against its own Alpine:
      # edge (Fairphone 6) and v26.06 = Alpine 3.24 (OnePlus 6, stable).
      - name: Build and sign, edge (Alpine edge, aarch64)
        env:
          RTL3D_OS_KEY: ${{ secrets.RTL3D_OS_KEY }}
        run: |
          docker run --rm -e RTL3D_OS_KEY -v "$PWD:/src" -w /src alpine:edge \
            sh tools/build.sh site/edge edge
      - name: Build and sign, v26.06 (Alpine 3.24, aarch64)
        env:
          RTL3D_OS_KEY: ${{ secrets.RTL3D_OS_KEY }}
        run: |
          docker run --rm -e RTL3D_OS_KEY -v "$PWD:/src" -w /src alpine:3.24 \
            sh tools/build.sh site/v26.06 v26.06
          sudo chown -R "$(id -u):$(id -g)" site   # made as root in the container
          cp README.md keys/rtl3d-os.rsa.pub site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
