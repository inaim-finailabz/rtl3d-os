# Builds RTL@3D OS's packages on arm64 and publishes the signed repository
# (edge) on GitHub Pages: https://inaim-finailabz.github.io/rtl3d-os/edge
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and sign (Alpine edge, aarch64)
        env:
          RTL3D_OS_KEY: ${{ secrets.RTL3D_OS_KEY }}
        run: |
          docker run --rm -e RTL3D_OS_KEY -v "$PWD:/src" -w /src alpine:edge \
            sh tools/build.sh site/edge
          cp README.md keys/rtl3d-os.rsa.pub site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
