# /etc/systemd/system/modem-gnss.service.d/rtl3d-fp6.conf
#
# The Fairphone 6's modem takes the engine lock but answers NotSupported to
# --loc-set-nmea-types=all, so modem-gnss.service fails every time. Its
# packaged limits (10 starts in 300 s, a restart every 30 s) never trip, so it
# went on retrying all day (1470 times by noon, each one talking to the modem).
# Here the NMEA step may fail ("-") without failing the service, and the limit
# is wide enough to stop a real failure.
[Unit]
StartLimitIntervalSec=900
StartLimitBurst=10

[Service]
ExecStart=
ExecStart=qmicli -d qrtr://0 --loc-set-engine-lock=mt
ExecStart=-qmicli -d qrtr://0 --loc-set-nmea-types=all
