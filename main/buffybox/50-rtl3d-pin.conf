# RTL@3D: the disk opens with the phone's PIN, so the startup screen is a
# PIN pad (the "pin" layout, 0001-unl0kr-pin-pad.patch), always shown, in
# the look of RTL@3D's lock screen (the "rtl3d" theme, same patch).
[keyboard]
layout=pin
autohide=false
popovers=false

[theme]
default=rtl3d
alternate=rtl3d
